<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #wrap { position: absolute; inset: 0; }
  .t { position: absolute; inset: 6px 2px 4px 10px; visibility: hidden; }
  .t.on { visibility: visible; }
  .xterm .xterm-viewport { background-color: transparent !important; }
  /* the scrollbar as the other vSuite apps': 12 px to aim at, a 6 px thumb that widens to 10 px (and brightens) when pointed at or
     dragged, never shorter than 40 px however long the scrollback */
  .xterm-viewport::-webkit-scrollbar { width: 12px; }
  .xterm-viewport::-webkit-scrollbar-thumb {
    background: var(--thumb, rgba(128,128,128,.45)); background-clip: padding-box;
    border: 3px solid transparent; border-radius: 6px; min-height: 40px;
  }
  .xterm-viewport::-webkit-scrollbar-thumb:hover,
  .xterm-viewport::-webkit-scrollbar-thumb:active { border-width: 1px; filter: brightness(1.35); }
  .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
</style>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="addon-web-links.js"></script>
<script src="addon-unicode11.js"></script>
<script src="addon-serialize.js"></script>
</head>
<body>
<div id="wrap"></div>
<script>
  // vTerm's display: one xterm.js terminal per tab. vTerm runs the shells (ConPTY) and passes text both ways as messages:
  //   from vTerm: theme, new, o (output), show, close, paste, exited, focus, ser (asks for a tab's screen and scrollback)
  //   to vTerm:   ready, i (typed), r (resized), title, copy, paste (asks for the clipboard), link, ser (the screen, as text to write
  //               into another window - a tab moved into a window of its own), key (vTerm's own keys: the keyboard is in this page)
  const host = window.chrome.webview;
  const wrap = document.getElementById('wrap');
  const terms = {};
  let theme = {}, fontFamily = "'Cascadia Mono', Consolas, 'Courier New', monospace", fontSize = 13;
  let active = null;

  function send(o) { host.postMessage(o); }

  function make(id) {
    const el = document.createElement('div');
    el.className = 't';
    wrap.appendChild(el);
    const term = new Terminal({
      allowProposedApi: true, allowTransparency: true, cursorBlink: true, scrollback: 10000,
      fontFamily: fontFamily, fontSize: fontSize, theme: theme, macOptionIsMeta: false
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.loadAddon(new WebLinksAddon.WebLinksAddon(function (e, uri) { send({ t: 'link', u: uri }); }));
    try { term.loadAddon(new Unicode11Addon.Unicode11Addon()); term.unicode.activeVersion = '11'; } catch (e) { }
    let ser = null;
    try { ser = new SerializeAddon.SerializeAddon(); term.loadAddon(ser); } catch (e) { ser = null; }
    term.open(el);
    term.onData(function (d) { send({ t: 'i', id: id, d: d }); });
    term.onResize(function (s) { send({ t: 'r', id: id, c: s.cols, r: s.rows }); });
    term.onTitleChange(function (v) { send({ t: 'title', id: id, v: v }); });
    // Ctrl+C copies when something is selected (otherwise it interrupts, as usual); Ctrl+V and Ctrl+Shift+V paste; Ctrl+Shift+C copies
    term.attachCustomKeyEventHandler(function (e) {
      if (e.type !== 'keydown') return true;
      const k = e.key.toLowerCase();
      if (e.ctrlKey && !e.altKey && k === 'c' && (e.shiftKey || term.hasSelection())) {
        if (term.hasSelection()) { send({ t: 'copy', d: term.getSelection() }); term.clearSelection(); }
        e.preventDefault(); return false;
      }
      if (e.ctrlKey && !e.altKey && k === 'v') { send({ t: 'paste', id: id }); e.preventDefault(); return false; }
      // vTerm's keys: the keyboard is in this page, so it passes them on
      if (e.ctrlKey && e.shiftKey && !e.altKey && k === 't') { send({ t: 'key', k: 'new' }); e.preventDefault(); return false; }
      if (e.ctrlKey && e.shiftKey && !e.altKey && k === 'w') { send({ t: 'key', k: 'close' }); e.preventDefault(); return false; }
      if (e.ctrlKey && !e.altKey && e.key === 'Tab') { send({ t: 'key', k: e.shiftKey ? 'prev' : 'next' }); e.preventDefault(); return false; }
      if (e.shiftKey && !e.ctrlKey && !e.altKey && e.key === 'Escape') { send({ t: 'key', k: 'hide' }); e.preventDefault(); return false; }
      if (e.ctrlKey && e.shiftKey && !e.altKey && k === 'o') { send({ t: 'key', k: 'popout' }); e.preventDefault(); return false; }
      return true;
    });
    // right-click: copy the selection, or paste when nothing is selected
    el.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      if (term.hasSelection()) { send({ t: 'copy', d: term.getSelection() }); term.clearSelection(); }
      else send({ t: 'paste', id: id });
    });
    terms[id] = { term: term, fit: fit, el: el, ser: ser };
    return terms[id];
  }

  function fitOne(x) {
    if (!x) return;
    try { x.fit.fit(); } catch (e) { }
    send({ t: 'r', id: idOf(x), c: x.term.cols, r: x.term.rows });
  }
  function idOf(x) { for (const k in terms) if (terms[k] === x) return k; return null; }

  function show(id) {
    for (const k in terms) terms[k].el.classList.toggle('on', k === id);
    active = id;
    const x = terms[id];
    if (x) { fitOne(x); x.term.focus(); }
  }

  host.addEventListener('message', function (ev) {
    const m = ev.data;
    if (!m || !m.t) return;
    switch (m.t) {
      case 'theme':
        theme = m.theme || theme;
        if (m.font) fontFamily = m.font;
        if (m.size) fontSize = m.size;
        if (m.thumb) document.documentElement.style.setProperty('--thumb', m.thumb);
        for (const k in terms) {
          const t = terms[k].term;
          t.options.theme = theme; t.options.fontFamily = fontFamily; t.options.fontSize = fontSize;
          fitOne(terms[k]);
        }
        break;
      case 'new': { const x = make(m.id); if (m.show !== false) show(m.id); else fitOne(x); break; }
      case 'o': { const x = terms[m.id]; if (x) x.term.write(m.d); break; }
      case 'show': show(m.id); break;
      case 'close': { const x = terms[m.id]; if (x) { x.term.dispose(); x.el.remove(); delete terms[m.id]; } break; }
      case 'paste': { const x = terms[m.id]; if (x && m.d) x.term.paste(m.d); break; }
      case 'exited': { const x = terms[m.id]; if (x) x.term.write('\r\n\x1b[2m[' + m.text + ']\x1b[0m\r\n'); break; }
      case 'focus': { const x = terms[active]; if (x) { fitOne(x); x.term.focus(); } break; }
      case 'ser': {
        // the screen and scrollback as text that draws them again (with colours, and the full-screen buffer of vim / htop / claude)
        const x = terms[m.id];
        let d = '';
        try { if (x && x.ser) d = x.ser.serialize({ scrollback: 10000 }); } catch (e) { d = ''; }
        send({ t: 'ser', id: m.id, d: d, c: x ? x.term.cols : 0, r: x ? x.term.rows : 0 });
        break;
      }
    }
  });

  window.addEventListener('resize', function () { if (active && terms[active]) fitOne(terms[active]); });
  send({ t: 'ready' });
</script>
</body>
</html>
